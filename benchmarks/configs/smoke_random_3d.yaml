experiment:
  name: smoke_random_3d
  mode: point
  seeds: [0]
  output_root: benchmark_runs

objective:
  kind: synthetic_simplex
  name: synthetic_3d_planted
  n_components: 3
  maximize: true
  params:
    n_needles: 4
    basin_width: 20.0
    noise_std: 0.0
    seed: 123
    match_radius_ilr: 0.25

optimizer:
  kind: random_simplex
  params: {}

budget:
  n_init: 5
  n_steps: 20
  n_line_points: 24

metrics:
  duplicate_radius_ilr: 0.03
  match_radius_ilr: 0.25

