experiment:
  name: milestone1a_synthetic_3d_line
  mode: line
  seeds: [0, 1, 2]
  output_root: benchmark_runs

objective:
  kind: synthetic_simplex
  name: synthetic_3d_planted
  n_components: 3
  maximize: true
  params:
    n_needles: 4
    basin_width: 20.0
    noise_std: 0.0
    seed: 123
    match_radius_ilr: 0.25

budget:
  n_init: 8
  n_lines: 5
  points_per_line: 24

line_mode:
  n_line_candidates: 64
  score: mean_acq
  include_endpoints: true

metrics:
  duplicate_radius_ilr: 0.03
  match_radius_ilr: 0.25

optimizers:
  - kind: random_simplex
    line_score: random
    params: {}
  - kind: gp_ard_ei
    line_score: mean_acq
    params:
      candidate_pool_size: 1024
      xi: 0.01
      device: cpu
      dtype: float64
  - kind: gp_ard_ucb
    line_score: mean_acq
    params:
      candidate_pool_size: 1024
      ucb_beta: 0.2
      device: cpu
      dtype: float64
  - kind: rf_bo
    line_score: mean_acq
    params:
      candidate_pool_size: 1024
      n_estimators: 100
      acquisition: ucb
      ucb_beta: 0.2
      n_jobs: -1
