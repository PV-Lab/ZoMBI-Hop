experiment:
  name: milestone1b_realistic_ackley_4d_point_external_mini
  mode: point
  seeds: [0, 1, 2]
  output_root: benchmark_runs

objective:
  kind: realistic_ackley_simplex
  name: realistic_ackley_4d
  n_components: 4
  maximize: true
  params:
    n_optima: 30
    basin_width: 65.0
    noise_freq: 9.0
    noise_amp: 300.0
    peak_seed: 0
    noise_seed: 42
    match_radius_ilr: 0.25
    match_radius_comp: 0.05

budget:
  n_init: 8
  n_steps: 10

metrics:
  duplicate_radius_ilr: 0.03
  match_radius_ilr: 0.25
  duplicate_radius_comp: 0.032
  match_radius_comp: 0.05

optimizers:
  - kind: random_simplex
    params: {}
  - kind: gp_ard_ei
    params:
      candidate_pool_size: 512
      xi: 0.01
      device: cpu
      dtype: float64
  - kind: gp_ard_ucb
    params:
      candidate_pool_size: 512
      ucb_beta: 0.2
      device: cpu
      dtype: float64
  - kind: rf_bo
    params:
      candidate_pool_size: 512
      n_estimators: 100
      acquisition: ucb
      ucb_beta: 0.2
      n_jobs: -1
  - kind: hebo
    params:
      internal_space: ilr
      ilr_bounds:
        method: candidate_pool_quantile
        n_candidates: 4096
        lower_quantile: 0.005
        upper_quantile: 0.995
      candidate_repair:
        clip_min: 1.0e-12
        renormalize: true
      objective_sign:
        hebo_internal: minimize
        benchmark_external: maximize
  - kind: turbo
    params:
      internal_space: ilr
      acquisition: log_ei
      candidate_pool_size: 512
      min_tr_candidates: 32
      ilr_bounds:
        method: candidate_pool_quantile
        n_candidates: 4096
        lower_quantile: 0.005
        upper_quantile: 0.995
      trust_region:
        initial_length: 0.8
        min_length: 0.01
        max_length: 1.6
        success_tolerance: 3
        failure_tolerance: 3
      device: cpu
      dtype: float64
  - kind: saasbo
    params:
      candidate_pool_size: 512
      warmup_steps: 32
      num_samples: 16
      thinning: 8
      train_yvar: 1.0e-6
      max_train_points: 120
      refit_every: 2
      device: cpu
      dtype: float64
      acquisition: log_ei
