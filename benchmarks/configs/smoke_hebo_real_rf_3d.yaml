experiment:
  name: smoke_hebo_real_rf_3d
  mode: point
  seeds: [0]
  output_root: benchmark_runs

objective:
  kind: real_rf_surrogate
  name: real_3d_perovskite_rf
  n_components: 3
  maximize: true
  params:
    data_path: data/campaign1a.csv
    component_labels: [FAPbI3, MAPbI3, MAPbBr3]
    composition_columns: [FAPbI3, MAPbI3, MAPbBr3]
    target_column: Objective
    feature_transform: raw_composition
    true_needles_path: optimize/reference_optima/mobo_05_06_15_32_campaign1a.json
    train_surrogate:
      enabled: true
      n_estimators: 50
      random_state: 42
      min_samples_leaf: 1
      n_jobs: -1
    needle_detection:
      method: grid_local_maxima
      grid_resolution: 51
      top_k: 20
      min_separation_ilr: 0.08
      match_radius_ilr: 0.25

optimizer:
  kind: hebo
  params:
    internal_space: ilr
    ilr_bounds:
      method: candidate_pool_quantile
      n_candidates: 4096
      lower_quantile: 0.005
      upper_quantile: 0.995
    candidate_repair:
      clip_min: 1.0e-12
      renormalize: true
    objective_sign:
      hebo_internal: minimize
      benchmark_external: maximize

budget:
  n_init: 8
  n_steps: 5

metrics:
  duplicate_radius_ilr: 0.03
  match_radius_ilr: 0.25
