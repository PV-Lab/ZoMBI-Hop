experiment:
  name: smoke_gp_ard_ucb_3d
  mode: point
  seeds: [0]
  output_root: benchmark_runs

objective:
  kind: synthetic_simplex
  name: synthetic_3d_planted
  n_components: 3
  maximize: true
  params:
    n_needles: 4
    basin_width: 20.0
    noise_std: 0.0
    seed: 123
    match_radius_ilr: 0.25

optimizer:
  kind: gp_ard_ucb
  params:
    candidate_pool_size: 256
    ucb_beta: 0.2
    device: cpu
    dtype: float64

budget:
  n_init: 5
  n_steps: 5

metrics:
  duplicate_radius_ilr: 0.03
  match_radius_ilr: 0.25

