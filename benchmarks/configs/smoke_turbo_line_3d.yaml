experiment:
  name: smoke_turbo_line_3d
  mode: line
  seeds: [0]
  output_root: benchmark_runs

objective:
  kind: synthetic_simplex
  name: synthetic_3d_planted
  n_components: 3
  maximize: true
  params:
    n_needles: 4
    basin_width: 20.0
    noise_std: 0.0
    seed: 123
    match_radius_ilr: 0.25

optimizer:
  kind: turbo
  line_score: mean_acq
  params:
    internal_space: ilr
    acquisition: log_ei
    candidate_pool_size: 512
    min_tr_candidates: 32
    ilr_bounds:
      method: candidate_pool_quantile
      n_candidates: 4096
      lower_quantile: 0.005
      upper_quantile: 0.995
    trust_region:
      initial_length: 0.8
      min_length: 0.01
      max_length: 1.6
      success_tolerance: 3
      failure_tolerance: 3
    device: cpu
    dtype: float64

budget:
  n_init: 5
  n_lines: 2
  points_per_line: 8

line_mode:
  n_line_candidates: 16
  score: mean_acq
  include_endpoints: true

metrics:
  duplicate_radius_ilr: 0.03
  match_radius_ilr: 0.25
