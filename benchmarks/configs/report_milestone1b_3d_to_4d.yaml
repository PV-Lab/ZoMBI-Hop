name: milestone1b_3d_to_4d
output_root: benchmark_runs/reports
comparison_axis: n_components

inputs:
  - label: realistic_ackley_3d_point_with_saasbo_mini
    objective_family: synthetic
    objective_kind: realistic_ackley_simplex
    objective: realistic_ackley_3d
    n_components: 3
    mode: point
    suite_config: benchmarks/configs/suite_milestone1a_realistic_ackley_3d_point_with_saasbo_mini.yaml
    aggregate_dir: benchmark_runs/milestone1a_realistic_ackley_3d_point_with_saasbo_mini/aggregate
  - label: realistic_ackley_3d_line_with_saasbo_mini
    objective_family: synthetic
    objective_kind: realistic_ackley_simplex
    objective: realistic_ackley_3d
    n_components: 3
    mode: line
    suite_config: benchmarks/configs/suite_milestone1a_realistic_ackley_3d_line_with_saasbo_mini.yaml
    aggregate_dir: benchmark_runs/milestone1a_realistic_ackley_3d_line_with_saasbo_mini/aggregate
  - label: realistic_ackley_4d_point_external_mini
    objective_family: synthetic
    objective_kind: realistic_ackley_simplex
    objective: realistic_ackley_4d
    n_components: 4
    mode: point
    suite_config: benchmarks/configs/suite_milestone1b_realistic_ackley_4d_point_external_mini.yaml
    aggregate_dir: benchmark_runs/milestone1b_realistic_ackley_4d_point_external_mini/aggregate
  - label: realistic_ackley_4d_line_external_mini
    objective_family: synthetic
    objective_kind: realistic_ackley_simplex
    objective: realistic_ackley_4d
    n_components: 4
    mode: line
    suite_config: benchmarks/configs/suite_milestone1b_realistic_ackley_4d_line_external_mini.yaml
    aggregate_dir: benchmark_runs/milestone1b_realistic_ackley_4d_line_external_mini/aggregate

metrics:
  higher_is_better:
    - final_best_y_so_far
    - final_pct_matched_ilr
    - final_pct_matched_comp
    - line_best_y_max
  lower_is_better:
    - final_dist_to_needles_ilr
    - final_dist_to_needles_comp
    - final_dup_fraction_ilr
    - final_dup_fraction_comp
    - final_dup_fraction_comp_cross_line
    - final_runtime_s

plots:
  include_seed_traces: true
  include_iqr_band: true
  dpi: 160
