experiment:
  name: smoke_realistic_ackley_line_4d
  mode: line
  seeds: [0]
  output_root: benchmark_runs

objective:
  kind: realistic_ackley_simplex
  name: realistic_ackley_4d
  n_components: 4
  maximize: true
  params:
    n_optima: 30
    basin_width: 65.0
    noise_freq: 9.0
    noise_amp: 300.0
    peak_seed: 0
    noise_seed: 42
    match_radius_ilr: 0.25
    match_radius_comp: 0.05

budget:
  n_init: 8
  n_lines: 3
  points_per_line: 24

line_mode:
  n_line_candidates: 32
  score: random
  include_endpoints: true

metrics:
  duplicate_radius_ilr: 0.03
  match_radius_ilr: 0.25
  duplicate_radius_comp: 0.032
  match_radius_comp: 0.05

optimizer:
  kind: random_simplex
  line_score: random
  params: {}
