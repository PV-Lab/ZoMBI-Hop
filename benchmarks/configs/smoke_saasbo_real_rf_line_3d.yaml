experiment:
  name: smoke_saasbo_real_rf_line_3d
  mode: line
  seeds: [0]
  output_root: benchmark_runs

objective:
  kind: real_rf_surrogate
  name: real_3d_perovskite_rf
  n_components: 3
  maximize: true
  params:
    data_path: data/campaign1a.csv
    component_labels: [FAPbI3, MAPbI3, MAPbBr3]
    composition_columns: [FAPbI3, MAPbI3, MAPbBr3]
    target_column: Objective
    feature_transform: raw_composition
    true_needles_path: optimize/reference_optima/mobo_05_06_15_32_campaign1a.json
    train_surrogate:
      enabled: true
      n_estimators: 100
      random_state: 42
      min_samples_leaf: 1
      n_jobs: -1
    needle_detection:
      method: grid_local_maxima
      grid_resolution: 101
      top_k: 20
      min_separation_ilr: 0.08
      match_radius_ilr: 0.25
      match_radius_comp: 0.05

budget:
  n_init: 8
  n_lines: 1
  points_per_line: 12

line_mode:
  n_line_candidates: 16
  score: mean_acq
  include_endpoints: true

metrics:
  duplicate_radius_ilr: 0.03
  match_radius_ilr: 0.25
  duplicate_radius_comp: 0.032
  match_radius_comp: 0.05

optimizer:
  kind: saasbo
  line_score: mean_acq
  params:
    candidate_pool_size: 512
    warmup_steps: 32
    num_samples: 16
    thinning: 8
    train_yvar: 1.0e-6
    max_train_points: 120
    refit_every: 1
    device: cpu
    dtype: float64
    acquisition: log_ei
    line_adapter_label: saasbo_acq_line
