experiment:
  name: milestone1a_real_rf_3d_point
  mode: point
  seeds: [0, 1, 2]
  output_root: benchmark_runs

objective:
  kind: real_rf_surrogate
  name: real_3d_perovskite_rf
  n_components: 3
  maximize: true
  params:
    data_path: data/campaign1a.csv
    component_labels: [FAPbI3, MAPbI3, MAPbBr3]
    composition_columns: [FAPbI3, MAPbI3, MAPbBr3]
    target_column: Objective
    feature_transform: raw_composition
    true_needles_path: optimize/reference_optima/mobo_05_06_15_32_campaign1a.json
    train_surrogate:
      enabled: true
      n_estimators: 100
      random_state: 42
      min_samples_leaf: 1
      n_jobs: -1
    needle_detection:
      method: grid_local_maxima
      grid_resolution: 101
      top_k: 20
      min_separation_ilr: 0.08
      match_radius_ilr: 0.25

budget:
  n_init: 8
  n_steps: 20

metrics:
  duplicate_radius_ilr: 0.03
  match_radius_ilr: 0.25

optimizers:
  - kind: random_simplex
    params: {}
  - kind: gp_ard_ei
    params:
      candidate_pool_size: 1024
      xi: 0.01
      device: cpu
      dtype: float64
  - kind: gp_ard_ucb
    params:
      candidate_pool_size: 1024
      ucb_beta: 0.2
      device: cpu
      dtype: float64
  - kind: rf_bo
    params:
      candidate_pool_size: 1024
      n_estimators: 100
      acquisition: ucb
      ucb_beta: 0.2
      n_jobs: -1
