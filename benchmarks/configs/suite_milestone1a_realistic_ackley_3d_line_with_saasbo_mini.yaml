experiment:
  name: milestone1a_realistic_ackley_3d_line_with_saasbo_mini
  mode: line
  seeds: [0, 1, 2]
  output_root: benchmark_runs

objective:
  kind: realistic_ackley_simplex
  name: realistic_ackley_3d
  n_components: 3
  maximize: true
  params:
    n_optima: 20
    basin_width: 86.0
    noise_freq: 9.0
    noise_amp: 400.0
    peak_seed: 0
    noise_seed: 42
    match_radius_ilr: 0.25
    match_radius_comp: 0.05

budget:
  n_init: 8
  n_lines: 3
  points_per_line: 24

line_mode:
  n_line_candidates: 32
  score: mean_acq
  include_endpoints: true

metrics:
  duplicate_radius_ilr: 0.03
  match_radius_ilr: 0.25
  duplicate_radius_comp: 0.032
  match_radius_comp: 0.05

optimizers:
  - kind: random_simplex
    line_score: random
    params: {}
  - kind: gp_ard_ei
    line_score: mean_acq
    params:
      candidate_pool_size: 512
      xi: 0.01
      device: cpu
      dtype: float64
  - kind: gp_ard_ucb
    line_score: mean_acq
    params:
      candidate_pool_size: 512
      ucb_beta: 0.2
      device: cpu
      dtype: float64
  - kind: rf_bo
    line_score: mean_acq
    params:
      candidate_pool_size: 512
      n_estimators: 100
      acquisition: ucb
      ucb_beta: 0.2
      n_jobs: -1
  - kind: zombihop
    params:
      device: cpu
      dtype: float64
      max_activations: 10
      max_zooms: 1
      max_iterations: 10
      n_restarts: 3
      raw: 32
      max_gp_points: 128
      acquisition_type: ucb
      ucb_beta: 0.1
      num_lines: 8
      checkpoint_subdir: checkpoints
  - kind: hebo
    params:
      internal_space: ilr
      line_adapter: anchor_chord
      ilr_bounds:
        method: candidate_pool_quantile
        n_candidates: 2048
        lower_quantile: 0.005
        upper_quantile: 0.995
      candidate_repair:
        clip_min: 1.0e-12
        renormalize: true
      objective_sign:
        hebo_internal: minimize
        benchmark_external: maximize
  - kind: turbo
    line_score: mean_acq
    params:
      internal_space: ilr
      acquisition: log_ei
      candidate_pool_size: 512
      min_tr_candidates: 32
      ilr_bounds:
        method: candidate_pool_quantile
        n_candidates: 2048
        lower_quantile: 0.005
        upper_quantile: 0.995
      trust_region:
        initial_length: 0.8
        min_length: 0.01
        max_length: 1.6
        success_tolerance: 3
        failure_tolerance: 3
      device: cpu
      dtype: float64
  - kind: saasbo
    line_score: mean_acq
    params:
      candidate_pool_size: 512
      warmup_steps: 64
      num_samples: 32
      thinning: 16
      train_yvar: 1.0e-6
      max_train_points: 160
      refit_every: 2
      device: cpu
      dtype: float64
      acquisition: log_ei
      line_adapter_label: saasbo_acq_line
