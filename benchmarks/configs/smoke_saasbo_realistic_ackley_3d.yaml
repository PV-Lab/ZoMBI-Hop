experiment:
  name: smoke_saasbo_realistic_ackley_3d
  mode: point
  seeds: [0]
  output_root: benchmark_runs

objective:
  kind: realistic_ackley_simplex
  name: realistic_ackley_3d
  n_components: 3
  maximize: true
  params:
    n_optima: 20
    basin_width: 86.0
    noise_freq: 9.0
    noise_amp: 400.0
    peak_seed: 0
    noise_seed: 42
    match_radius_ilr: 0.25
    match_radius_comp: 0.05

budget:
  n_init: 5
  n_steps: 2

metrics:
  duplicate_radius_ilr: 0.03
  match_radius_ilr: 0.25
  duplicate_radius_comp: 0.032
  match_radius_comp: 0.05

optimizer:
  kind: saasbo
  params:
    candidate_pool_size: 512
    warmup_steps: 32
    num_samples: 16
    thinning: 8
    train_yvar: 1.0e-6
    max_train_points: 120
    refit_every: 1
    device: cpu
    dtype: float64
    acquisition: log_ei
