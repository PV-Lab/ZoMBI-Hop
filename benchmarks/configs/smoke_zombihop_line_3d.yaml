experiment:
  name: smoke_zombihop_line_3d
  mode: line
  seeds: [0]
  output_root: benchmark_runs

objective:
  kind: synthetic_simplex
  name: synthetic_3d_planted
  n_components: 3
  maximize: true
  params:
    n_needles: 4
    basin_width: 20.0
    noise_std: 0.0
    seed: 123
    match_radius_ilr: 0.25

optimizer:
  kind: zombihop
  params:
    device: cpu
    dtype: float64
    max_activations: 10
    max_zooms: 1
    max_iterations: 10
    n_restarts: 3
    raw: 32
    max_gp_points: 128
    acquisition_type: ucb
    ucb_beta: 0.1
    num_lines: 8
    checkpoint_subdir: checkpoints

budget:
  n_init: 5
  n_lines: 3
  points_per_line: 8

metrics:
  duplicate_radius_ilr: 0.03
  match_radius_ilr: 0.25
